name: Generate MaleCNS Assets

on:
  push:
    branches:
      - feature/malecns-data-pipeline
    paths:
      - 'tools/malecns-export/**'
      - 'src/brain/CircuitTypes.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generate-malecns-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      NEUPRINT_TOKEN: ${{ secrets.NEUPRINT_TOKEN }}
    steps:
      - name: Check neuPrint token availability
        id: token
        shell: bash
        run: |
          if [ -n "$NEUPRINT_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Token not configured
        if: steps.token.outputs.available != 'true'
        run: echo 'NEUPRINT_TOKEN repository secret is not configured; skipping real MaleCNS export.'

      - uses: actions/checkout@v4
        if: steps.token.outputs.available == 'true'

      - uses: r-lib/actions/setup-r@v2
        if: steps.token.outputs.available == 'true'
        with:
          r-version: 'release'

      - name: Install MaleCNS R dependencies
        if: steps.token.outputs.available == 'true'
        run: |
          Rscript -e 'install.packages(c("natmanager", "jsonlite", "dplyr"), repos="https://cloud.r-project.org")'
          Rscript -e 'natmanager::install(pkgs="natverse/malecns")'

      - name: Export real male-cns:v1.0 circuit
        if: steps.token.outputs.available == 'true'
        env:
          neuprint_token: ${{ secrets.NEUPRINT_TOKEN }}
        run: Rscript tools/malecns-export/export.R

      - uses: actions/setup-node@v4
        if: steps.token.outputs.available == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        if: steps.token.outputs.available == 'true'
        run: npm ci

      - name: Pack compact browser assets
        if: steps.token.outputs.available == 'true'
        run: npm run data:pack

      - name: Validate generated assets
        if: steps.token.outputs.available == 'true'
        shell: bash
        run: |
          test -s tools/malecns-export/out/raw-circuit.json
          test -s public/data/male-cns-v1/circuit.bin
          test -s public/data/male-cns-v1/metadata.json
          test -s public/data/male-cns-v1/manifest.json
          if grep -Fq "$NEUPRINT_TOKEN" tools/malecns-export/out/raw-circuit.json public/data/male-cns-v1/metadata.json public/data/male-cns-v1/manifest.json; then
            echo 'Token material found in generated JSON output' >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const metadata = JSON.parse(fs.readFileSync('public/data/male-cns-v1/metadata.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('public/data/male-cns-v1/manifest.json', 'utf8'));
          if (metadata.dataset !== 'male-cns:v1.0') throw new Error('Unexpected dataset');
          if (metadata.circuit !== 'dna-steering-v1') throw new Error('Unexpected circuit');
          if (metadata.behaviorPorts.turnLeft.length === 0 || metadata.behaviorPorts.turnRight.length === 0) {
            throw new Error('Both steering sides must be source-verified');
          }
          if (metadata.behaviorPorts.forward.length !== 0) {
            throw new Error('V1 DNa circuit must not invent a forward-speed readout');
          }
          if (manifest.neuronCount !== metadata.neurons.length) throw new Error('Neuron count mismatch');
          console.log(`Validated ${manifest.neuronCount} neurons and ${manifest.edgeCount} edges`);
          NODE

      - name: Upload auditable MaleCNS assets
        if: steps.token.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: male-cns-v1-neural-brush-assets
          retention-days: 7
          if-no-files-found: error
          path: |
            tools/malecns-export/out/raw-circuit.json
            public/data/male-cns-v1/circuit.bin
            public/data/male-cns-v1/metadata.json
            public/data/male-cns-v1/manifest.json
