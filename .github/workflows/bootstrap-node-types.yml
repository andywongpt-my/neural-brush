name: Generate Node types lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --save-dev @types/node
      - uses: actions/upload-artifact@v4
        with:
          name: node-types-package
          path: |
            package.json
            package-lock.json
