name: Bootstrap Node types

on:
  push:
    branches:
      - feature/malecns-data-pipeline
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/malecns-data-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --save-dev @types/node
      - name: Commit package metadata
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add Node types for data tools"
          git push origin HEAD:feature/malecns-data-pipeline
