name: Inspect MaleCNS Bulk Schemas

on:
  push:
    branches:
      - feature/malecns-data-pipeline
    paths:
      - '.github/workflows/inspect-malecns-bulk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyarrow
      - name: Download public metadata tables
        shell: bash
        run: |
          set -euo pipefail
          base='https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome'
          curl -fL --retry 3 -o /tmp/annotations.feather "$base/body-annotations-male-cns-v1.0-minconf-0.5.feather"
          curl -fL --retry 3 -o /tmp/neurotransmitters.feather "$base/body-neurotransmitters-male-cns-v1.0.feather"
      - name: Print schemas and DNa seed rows
        shell: bash
        run: |
          python - <<'PY'
          import pyarrow.feather as feather
          import pyarrow.compute as pc

          ann = feather.read_table('/tmp/annotations.feather')
          nt = feather.read_table('/tmp/neurotransmitters.feather')
          print('ANNOTATION_SCHEMA')
          print(ann.schema)
          print('NT_SCHEMA')
          print(nt.schema)

          names = set(ann.column_names)
          type_col = next((c for c in ('type','cell_type','cellType') if c in names), None)
          if not type_col:
              raise SystemExit(f'No type column found; columns={ann.column_names}')
          mask = pc.is_in(ann[type_col], value_set=__import__('pyarrow').array(['DNa01','DNa02']))
          seeds = ann.filter(mask)
          print('DNA_SEED_ROWS')
          print(seeds.to_pylist())
          PY
