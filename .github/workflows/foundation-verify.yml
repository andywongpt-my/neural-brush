name: Foundation Verify

on:
  push:
    branches:
      - feature/foundation-pages
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run smoke test
        run: npm test -- --run tests/unit/smoke.test.ts
      - name: Upload generated package lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
